services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: feedsync-api:local
    ports:
      - "3001:8080"
    env_file:
      - ../../.env
    environment:
      PORT: 8080
      FEED_SYNC_DB_PATH: /app/data/feed_sync.db
      API_CORS_ORIGINS: http://localhost:3000
    volumes:
      - feed-sync-data:/app/data
    restart: unless-stopped

volumes:
  feed-sync-data:
